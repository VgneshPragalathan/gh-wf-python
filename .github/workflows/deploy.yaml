name: Python Workflow
on: 
  workflow_dispatch:
    inputs:
      name:
        type: string
        description: "Name of the actor"
        default: Vignesh
      gender:
        type: choice
        options:
          - Male
          - Female
        required: true
env:
  ENV_NAME: environment
jobs: 
  my-first-job:
    runs-on: ubuntu-latest
    outputs:
      job1_op: ${{ steps.set-output.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run Script
        run: python main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-output
          path: src/

      - name: Set Output
        id: set-output
        run : echo name=Vicky >> $GITHUB_OUTPUT

      - name: Access Output
        run: echo "Output value is ${{ steps.set-output.outputs.name }}"

      - name: Access Input
        run: echo ${{ inputs.name }}

      - name: Access env var
        run: echo $ENV_NAME

  my-second-job:
    runs-on: ubuntu-latest
    needs: my-first-job
    steps:
      - name: Access output var from job 1
        run : echo "Job1 Output ${{ needs.my-first-job.outputs.job1_op }}"